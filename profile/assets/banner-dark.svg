<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Inversiones ABDO 77, proveedor de internet en Carabobo, Venezuela">
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .dot { fill: #30363d; }
    .eyebrow { fill: #d97757; }
    .name { fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; }
    .line { animation: show .35s ease-out backwards; }
    .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.4s; } .l4 { animation-delay: 2s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="dot" cx="2" cy="2" r="1.2"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="fadeMask"><rect x="560" y="0" width="640" height="340" fill="url(#fade)"/></mask>
  </defs>

  <rect class="card" x="1" y="1" width="1198" height="338" rx="16"/>
  <rect x="560" y="2" width="637" height="336" fill="url(#dots)" mask="url(#fadeMask)"/>

  <text class="mono eyebrow" x="64" y="104" letter-spacing="2">PROVEEDOR DE INTERNET · CARABOBO, VENEZUELA</text>
  <text class="sans name" x="62" y="170" font-size="52" font-weight="700">Inversiones ABDO 77</text>
  <text class="sans muted" x="64" y="220" font-size="22">Internet rápido y confiable</text>
  <text class="sans muted" x="64" y="252" font-size="22">para tu hogar y tu negocio.</text>

  <!-- terminal stays dark in both themes -->
  <g transform="translate(700 60)">
    <rect width="436" height="220" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
    <text class="mono" x="218" y="27" text-anchor="middle" fill="#6e7681" font-size="13">noc — ~/abdo77</text>
    <line x1="0" y1="44" x2="436" y2="44" stroke="#30363d"/>
    <text class="mono line" x="24" y="82"><tspan fill="#6e7681">$</tspan><tspan fill="#e6edf3"> ping abdo77.com.ve</tspan></text>
    <text class="mono line l2" x="24" y="114"><tspan fill="#d97757">&gt;</tspan><tspan fill="#c9d1d9"> fibra óptica · radiofrecuencia</tspan></text>
    <text class="mono line l3" x="24" y="146" fill="#3fb950">✓ simétrico   ✓ ilimitado   ✓ IPv6</text>
    <g class="line l4"><text class="mono" x="24" y="178" fill="#6e7681">$</text><rect class="cursor" x="40" y="165" width="9" height="17" fill="#e6edf3"/></g>
  </g>
</svg>
